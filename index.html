<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyAzor Bar Prep | Strategic Bar Exam Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        top: 0px !important;
      }
      h1, h2, h3, h4, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .legal-accent {
        color: #B4975A;
      }
      .bg-legal-accent {
        background-color: #B4975A;
      }
      .border-legal-accent {
        border-color: #B4975A;
      }

      /* Force the widget container to be visible */
      .translate-widget-container {
        border: 1px solid #e2e8f0;
        padding: 4px;
        border-radius: 8px;
        background-color: white;
        min-width: 140px;
        display: inline-block;
        vertical-align: middle;
      }

      /* Fix Google's layout and hide banner */
      .goog-te-banner-frame.skiptranslate {
        display: none !important;
      }
      
      .goog-te-gadget {
        font-family: 'Inter', sans-serif !important;
        font-size: 13px !important;
        color: #0F172A !important; /* Navy blue text */
      }

      .goog-te-gadget-simple {
        background-color: transparent !important;
        border: none !important;
        padding: 0 !important;
        display: inline-flex !important;
        align-items: center !important;
        cursor: pointer;
      }

      .goog-te-gadget-simple .goog-te-menu-value span {
        color: #334155 !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        font-size: 10px !important;
        letter-spacing: 0.05em !important;
      }

      .goog-te-gadget-icon {
        display: none !important;
      }

      .goog-te-menu-value img {
        display: none !important;
      }

      .goog-te-menu-value:after {
        content: '';
        display: inline-block;
        margin-left: 6px;
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 4px solid #B4975A;
      }

      #google_translate_element {
        z-index: 9999;
      }

      /* Desktop adjustments for translator */
      @media (min-width: 768px) {
        .translate-widget-container {
          margin-top: 0;
        }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "framer-motion": "https://esm.sh/framer-motion@^11.15.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "vite": "https://esm.sh/vite@^7.3.1"
      }
    }
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
