<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyAzor Bar Prep | Strategic Bar Exam Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Calendly Widget Assets -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        top: 0px !important;
      }
      h1, h2, h3, h4, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      .legal-accent {
        color: #B4975A;
      }
      .bg-legal-accent {
        background-color: #B4975A;
      }
      .border-legal-accent {
        border-color: #B4975A;
      }

      /* Base layout styles */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* 1. Container Style */
      .translate-widget-nav {
        display: inline-block;
        min-width: 140px;
        min-height: 40px;
        background-color: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 5px;
        margin-left: 10px;
      }

      /* 2. Google Dropdown Styling */
      .goog-te-combo {
        width: 100% !important;
        font-family: 'Inter', sans-serif !important;
        color: #0F172A !important; /* Navy Blue */
        font-weight: 500 !important;
        border: none !important;
        background: transparent !important;
        outline: none !important;
      }

      /* 3. Hide Google Banner/Logo */
      .goog-logo-link { display: none !important; }
      .goog-te-gadget { color: transparent !important; font-size: 0 !important; }
      .goog-te-gadget span { display: none !important; }
      .goog-te-banner-frame { display: none !important; }
      body { top: 0px !important; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "framer-motion": "https://esm.sh/framer-motion@^11.15.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "vite": "https://esm.sh/vite@^7.3.1"
      }
    }
    </script>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'es,fr,pt,zh-CN,ar',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800">
    <div id="root"></div>
    
    <!-- Hidden Netlify form kept for metadata build-time detection if needed, though replaced by Calendly -->
    <form name="booking-leads" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
    </form>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
